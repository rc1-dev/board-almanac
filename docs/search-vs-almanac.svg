<title id="title">Search returns every version; Almanac records which one applies</title>
<desc id="desc">A search for the monthly fee in the validation archive returns seven documents giving $210, $225, $230, $235, $240 and $250. The almanac records that $240 has applied since March 1, 2026, set by the board minutes of January 20, 2026, and explains each other figure.</desc>
